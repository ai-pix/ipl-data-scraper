<!-- Key Player Card Template -->
<div style="background-color: rgba(255,255,255,0.1); padding: 15px; border-radius: 10px; min-width: 200px; text-align: center;">
    <p style="font-weight: bold; font-size: 1.1rem;">{{player_name}}</p>
    <p>{{player_role}}</p>
    <div style="margin-top: 10px;">
        <p style="font-size: 0.9rem;">{{player_stat1_label}}: <strong>{{player_stat1_value}}</strong></p>
        <p style="font-size: 0.9rem;">{{player_stat2_label}}: <strong>{{player_stat2_value}}</strong></p>
    </div>
</div>
