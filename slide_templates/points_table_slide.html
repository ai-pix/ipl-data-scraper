<!-- Points Table Slide Template -->
<div class="slide" id="slide-{{slide_index}}">
    <div class="slide-bg"></div>
    <div class="slide-content">
        <h2 class="slide-title">IPL Points Table</h2>
        <table>
            <thead>
                <tr>
                    <th>POS</th>
                    <th></th>
                    <th>Team</th>
                    <th>P</th>
                    <th>W</th>
                    <th>L</th>
                    <th>NR</th>
                    <th>NRR</th>
                    <th>For</th>
                    <th>Against</th>
                    <th>Pts</th>
                    <th>Form</th>
                </tr>
            </thead>
            <tbody>
                {{points_table_rows}}
            </tbody>
        </table>
    </div>
</div>
