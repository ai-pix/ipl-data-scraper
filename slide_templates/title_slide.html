<!-- Title Slide Template -->
<div class="slide active" id="slide-{{slide_index}}">
    <div class="slide-bg"></div>
    <div class="slide-content">
        <div class="title-slide">
            <h1>{{main_title}}</h1>
            <h2>{{subtitle}}</h2>

            <div class="team-logos">
                <img src="../team_data/{{team1_abbr}}_logo.png" alt="{{team1}}" class="team-logo animate-in-delay-1">
                <div class="vs-text animate-in-delay-2">VS</div>
                <img src="../team_data/{{team2_abbr}}_logo.png" alt="{{team2}}" class="team-logo animate-in-delay-1">
            </div>

            <p class="animate-in-delay-3">{{date}}</p>
        </div>
    </div>
</div>
