<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <style>
        /* Reset and Base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            line-height: 1.6;
            overflow: hidden;
            height: 100vh;
        }
        
        /* Slide container */
        .slide-container {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        
        /* Slides */
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            opacity: 0;
            transition: opacity 0.8s ease, transform 0.8s ease;
            transform: translateX(100%);
            z-index: 1;
        }
        
        .slide.active {
            opacity: 1;
            transform: translateX(0);
            z-index: 2;
        }
        
        .slide.prev {
            transform: translateX(-100%);
        }
        
        /* Slide content */
        .slide-content {
            position: relative;
            width: 100%;
            max-width: 1200px;
            background-color: rgba(18, 18, 18, 0.8);
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow-y: auto;
            max-height: 90vh;
            z-index: 1;
        }
        
        .slide-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .slide-subtitle {
            font-size: 1.5rem;
            font-weight: 400;
            margin-bottom: 20px;
            text-align: center;
            color: #cccccc;
        }
        
        /* Navigation controls */
        .slide-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 20px;
            z-index: 10;
        }
        
        .prev-btn, .next-btn {
            background-color: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 50px;
            transition: background-color 0.3s;
        }
        
        .prev-btn:hover, .next-btn:hover {
            background-color: rgba(255, 255, 255, 0.4);
        }
        
        /* Progress indicators */
        .slide-indicators {
            position: absolute;
            bottom: 80px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 10px;
            z-index: 10;
        }
        
        .indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s;
        }
        
        .indicator.active {
            background-color: #ffffff;
            transform: scale(1.2);
        }
        
        /* Tables */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            border-radius: 5px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        
        th, td {
            padding: 12px 15px;
            text-align: left;
        }
        
        th {
            background-color: var(--primary-color, rgba(0, 123, 255, 0.8));
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9rem;
        }
        
        tr:nth-child(even) {
            background-color: rgba(255, 255, 255, 0.05);
        }
        
        tr:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        
        /* Title slide */
        .title-slide {
            text-align: center;
        }
        
        .title-slide h1 {
            font-size: 4rem;
            margin-bottom: 20px;
            background: linear-gradient(45deg, var(--gradient-start, #3498db), var(--gradient-mid, #1abc9c), var(--gradient-end, #9b59b6));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: none;
        }
        
        .title-slide h2 {
            font-size: 2rem;
            margin-bottom: 30px;
            color: var(--accent-color, #f1c40f);
        }
        
        /* Stats leaders */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            width: 100%;
        }
        
        .stat-card {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        
        .player-name {
            font-weight: 600;
            font-size: 1.2rem;
            margin-bottom: 5px;
        }
        
        .player-team {
            color: #cccccc;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }
        
        .player-stat {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-color, #f1c40f);
        }
        
        /* Team comparison */
        .team-comparison {
            display: flex;
            width: 100%;
            justify-content: space-between;
            margin-top: 20px;
        }
        
        .team-side {
            flex: 1;
            text-align: center;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin: 0 10px;
        }
        
        .team-logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 15px;
        }
        
        .vs-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 20px;
        }
        
        .vs-text {
            font-size: 2rem;
            font-weight: 700;
            color: #e74c3c;
            margin-bottom: 10px;
        }
        
        .prediction-text {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--accent-color, #f1c40f);
            text-align: center;
            margin-top: 20px;
        }
        
        /* Head to head comparison */
        .head-to-head {
            margin-top: 20px;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        
        .head-to-head h3 {
            text-align: center;
            margin-bottom: 15px;
            color: var(--accent-color, #f1c40f);
        }
        
        .head-to-head-stats {
            display: flex;
            justify-content: space-between;
            text-align: center;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            margin: 10px 0;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: #cccccc;
        }
        
        /* Team overview */
        .team-overview {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .team-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .team-stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            width: 100%;
            margin-top: 20px;
        }
        
        .team-stat-card {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        
        .team-stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary-color, #3498db);
            margin-bottom: 5px;
        }
        
        .team-stat-label {
            font-size: 0.8rem;
            color: #cccccc;
        }
        
        /* Weather and pitch conditions */
        .venue-conditions {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }
        
        .condition-box {
            flex: 1;
            min-width: 300px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
        }
        
        .condition-box h3 {
            color: var(--accent-color, #f1c40f);
            margin-bottom: 15px;
            text-align: center;
        }
        
        .weather-icon {
            font-size: 3rem;
            text-align: center;
            margin: 10px 0;
        }
        
        .weather-details, .pitch-details {
            margin-top: 15px;
        }
        
        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .detail-label {
            font-weight: 600;
        }
        
        /* Player gallery */
        .player-gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            width: 100%;
        }
        
        .player-card {
            width: 150px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s;
        }
        
        .player-card:hover {
            transform: translateY(-5px);
        }
        
        .player-image {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }
        
        .player-card-details {
            padding: 10px;
        }
        
        .player-card-name {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .player-card-team {
            color: #cccccc;
            font-size: 0.8rem;
        }
        
        /* Background effects */
        .slide-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            filter: blur(10px) brightness(0.3);
            z-index: 0;
        }
        
        /* Team-specific colors */
        .team-colors {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7));
            z-index: 0;
        }
        
        /* Additional styles for new slide types */
        .detailed-comparison {
            margin-top: 20px;
        }
        
        .comparison-tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        
        .comparison-tab {
            padding: 10px 20px;
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            cursor: pointer;
            margin: 0 5px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        
        .comparison-tab.active {
            background-color: rgba(52, 152, 219, 0.8);
        }
        
        .comparison-content {
            display: none;
        }
        
        .comparison-content.active {
            display: block;
        }
        
        .stat-bar-container {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .team-name {
            flex: 2;
            font-weight: 600;
        }
        
        .bar-container {
            flex: 5;
            height: 20px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        
        .bar {
            height: 100%;
            background-color: var(--primary-color, #3498db);
            border-radius: 10px;
            transition: width 1s ease-out;
        }
        
        .stat-value {
            flex: 1;
            text-align: right;
        }
        
        /* Media Queries */
        @media (max-width: 768px) {
            .slide-content {
                padding: 20px;
            }
            
            .slide-title {
                font-size: 1.8rem;
            }
            
            .stats-container {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
            
            table {
                font-size: 0.9rem;
            }
            
            th, td {
                padding: 8px 10px;
            }
            
            .team-comparison {
                flex-direction: column;
                gap: 20px;
            }
            
            .vs-container {
                margin: 10px 0;
            }
            
            .head-to-head-stats {
                flex-direction: column;
            }
        }
        
        /* Auto-advancing animation */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .highlight {
            animation: pulse 2s infinite ease-in-out;
        }

        /* Team specific themes - will be customized by the generator */
        /* {{team_specific_css}} */
    </style>
</head>
<body>
    <div class="slide-container">
        <!-- Slides will be dynamically generated here -->
        {{slides_content}}

        <div class="slide-controls">
            <button class="prev-btn">Previous</button>
            <button class="next-btn">Next</button>
        </div>
        
        <div class="slide-indicators">
            <!-- Indicators will be dynamically generated here -->
            {{indicators}}
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Variables
            const slides = document.querySelectorAll('.slide');
            const prevBtn = document.querySelector('.prev-btn');
            const nextBtn = document.querySelector('.next-btn');
            const indicators = document.querySelectorAll('.indicator');
            let currentSlide = 0;
            let slideshowInterval;
            let isAutoSliding = true;
            const slideDuration = 10000; // 10 seconds per slide
            
            // Set dynamic backgrounds for slides
            slides.forEach((slide, index) => {
                // Background gradients will be populated by the generator
                const colors = [
                    'linear-gradient(45deg, #1a237e, #283593)', 
                    'linear-gradient(45deg, #004d40, #00695c)',
                    'linear-gradient(45deg, #b71c1c, #c62828)',
                    'linear-gradient(45deg, #4a148c, #6a1b9a)',
                    'linear-gradient(45deg, #e65100, #ef6c00)',
                    'linear-gradient(45deg, #880e4f, #ad1457)'
                ];
                // The line below will be replaced by the actual gradients
                // {{background_gradients}}
                
                slide.querySelector('.slide-bg').style.background = colors[index % colors.length];
            });
            
            // Function to show a specific slide
            function showSlide(n) {
                // Validate slide index
                if (n >= slides.length) {
                    currentSlide = 0;
                } else if (n < 0) {
                    currentSlide = slides.length - 1;
                } else {
                    currentSlide = n;
                }
                
                // Update slide classes
                slides.forEach((slide, index) => {
                    if (index < currentSlide) {
                        slide.className = 'slide prev';
                    } else if (index === currentSlide) {
                        slide.className = 'slide active';
                    } else {
                        slide.className = 'slide';
                    }
                });
                
                // Update indicators
                indicators.forEach((indicator, index) => {
                    indicator.classList.toggle('active', index === currentSlide);
                });
                
                // Reset slideshow timer when manually changing slides
                resetSlideshow();
            }
            
            // Function to go to the next slide
            function nextSlide() {
                showSlide(currentSlide + 1);
            }
            
            // Function to go to the previous slide
            function prevSlide() {
                showSlide(currentSlide - 1);
            }
            
            // Function to start automatic slideshow
            function startSlideshow() {
                isAutoSliding = true;
                slideshowInterval = setInterval(nextSlide, slideDuration);
            }
            
            // Function to reset slideshow timer
            function resetSlideshow() {
                clearInterval(slideshowInterval);
                startSlideshow();
            }
            
            // Function to pause slideshow
            function pauseSlideshow() {
                isAutoSliding = false;
                clearInterval(slideshowInterval);
            }
            
            // Event listeners
            nextBtn.addEventListener('click', function() {
                nextSlide();
            });
            
            prevBtn.addEventListener('click', function() {
                prevSlide();
            });
            
            indicators.forEach((indicator, index) => {
                indicator.addEventListener('click', function() {
                    showSlide(index);
                });
            });
            
            // Keyboard navigation
            document.addEventListener('keydown', function(e) {
                if (e.key === 'ArrowRight') {
                    nextSlide();
                } else if (e.key === 'ArrowLeft') {
                    prevSlide();
                } else if (e.key === 'Escape') {
                    if (isAutoSliding) {
                        pauseSlideshow();
                    } else {
                        startSlideshow();
                    }
                }
            });
            
            // Pause slideshow when user interacts with the page
            document.addEventListener('mousemove', function() {
                pauseSlideshow();
                
                // Resume after inactivity
                clearTimeout(window.resumeTimeout);
                window.resumeTimeout = setTimeout(startSlideshow, 30000); // Resume after 30 seconds of inactivity
            });
            
            // Touch swipe functionality
            let touchStartX = 0;
            let touchEndX = 0;
            
            document.addEventListener('touchstart', function(e) {
                touchStartX = e.changedTouches[0].screenX;
            }, false);
            
            document.addEventListener('touchend', function(e) {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            }, false);
            
            function handleSwipe() {
                if (touchEndX < touchStartX - 50) {
                    nextSlide(); // Swipe left
                } else if (touchEndX > touchStartX + 50) {
                    prevSlide(); // Swipe right
                }
            }
            
            // Apply bar widths from data attributes
            document.querySelectorAll('.bar[data-width]').forEach(bar => {
                const width = bar.getAttribute('data-width');
                if (width) {
                    bar.style.width = width + '%';
                }
            });
            
            // Start slideshow
            startSlideshow();

            // Add custom scripts if needed
            /* Custom scripts will be inserted here */
            // {{custom_scripts}}
        });
    </script>
</body>
</html>
